[project]
name = "Python_Basic_Tutorial"
version = "0.1.0"
description = "Python Tuttorial for Developer. Provides basic knowledge of Python, Jupyter, and Matplotlib to master our machine learning course."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipympl>=0.9.7",
    "ipytest>=0.14.2",
    "jupyterlab-language-pack-de-de>=4.4.post0",
    "matplotlib>=3.10.3",
    "mpl-interactions>=0.24.2",
    "numpy>=2.2.6",
    "pillow>=11.2.1",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pynvim>=0.5.2",
]
local = [
    "jupyter>=1.1.1",
]
